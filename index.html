<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="OLDIFY - Buy and sell used items easily.">
<title>OLDIFY - Buy & Sell Everything</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  color: #222;
}
header {
  background: #ff6b35;
  color: white;
  padding: 20px;
  text-align: center;
}
header h1 {
  margin: 0;
  font-size: 32px;
}
header p {
  margin-bottom: 0;
}
.search {
  padding: 18px;
  text-align: center;
  background: white;
}
.search input {
  width: 95%;
  max-width: 500px;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
}
nav {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 15px;
}
nav button, .sell-button {
  background: #ff6b35;
  color: white;
  border: 0;
  padding: 12px 16px;
  border-radius: 8px;
  cursor: pointer;
}
h2 {
  text-align: center;
}
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 15px;
  padding: 15px;
}
.card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 2px 8px #ddd;
}
.card .emoji {
  font-size: 55px;
  text-align: center;
}
.card h3 {
  font-size: 17px;
}
.price {
  color: #e65324;
  font-weight: bold;
}
section.sell {
  background: white;
  margin: 15px;
  padding: 20px;
  border-radius: 12px;
}
.sell input, .sell textarea, .sell select {
  display: block;
  width: 100%;
  margin: 10px 0;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
}
footer {
  text-align: center;
  background: #222;
  color: white;
  padding: 22px;
}
</style>
</head>

<body>
<header>
  <h1>OLDIFY</h1>
  <p>Buy & Sell Everything 🛍️</p>
</header>

<div class="search">
  <input id="search" type="search"
  placeholder="Search for products..."
  oninput="searchProducts()">
</div>

<nav>
  <button onclick="filterProducts('All')">All Items</button>
  <button onclick="filterProducts('Electronics')">Electronics</button>
  <button onclick="filterProducts('Fashion')">Fashion</button>
  <button onclick="filterProducts('Furniture')">Furniture</button>
  <button onclick="filterProducts('Books')">Books</button>
</nav>

<h2>🛍️ Explore Products</h2>
<div class="products" id="products"></div>

<section class="sell">
  <h2>📦 Sell Your Item</h2>
  <p>Add your item below to display it on this page.</p>

  <form id="sellForm">
    <input id="itemName" placeholder="Item name" required>
    <input id="itemPrice" type="number"
    min="1" placeholder="Price in ₹" required>

    <select id="itemCategory">
      <option>Electronics</option>
      <option>Fashion</option>
      <option>Furniture</option>
      <option>Books</option>
      <option>Other</option>
    </select>

    <textarea id="itemDescription"
    placeholder="Item description" required></textarea>

    <button class="sell-button" type="submit">
      Add Item
    </button>
  </form>
  <p id="message"></p>
</section>

<footer>
  <h3>OLDIFY</h3>
  <p>Buy & Sell Everything</p>
  <p>Made with ❤️</p>
</footer>

<script>
let items = [
  {name:"Used Smartphone",price:4500,category:"Electronics",emoji:"📱"},
  {name:"Study Books",price:250,category:"Books",emoji:"📚"},
  {name:"Office Chair",price:1200,category:"Furniture",emoji:"🪑"},
  {name:"Fashion Bag",price:400,category:"Fashion",emoji:"👜"}
];

let currentCategory = "All";

function renderProducts() {
  const container = document.getElementById("products");
  const query = document.getElementById("search").value.toLowerCase();

  const filtered = items.filter(item =>
    (currentCategory === "All" || item.category === currentCategory) &&
    item.name.toLowerCase().includes(query)
  );

  container.innerHTML = "";

  if (!filtered.length) {
    container.innerHTML = "<p>No products found.</p>";
    return;
  }

  filtered.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";

    const emoji = document.createElement("div");
    emoji.className = "emoji";
    emoji.textContent = item.emoji || "📦";

    const title = document.createElement("h3");
    title.textContent = item.name;

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = "₹" + item.price;

    const category = document.createElement("p");
    category.textContent = item.category;

    card.append(emoji, title, price, category);
    container.appendChild(card);
  });
}

function filterProducts(category) {
  currentCategory = category;
  renderProducts();
}

function searchProducts() {
  renderProducts();
}

document.getElementById("sellForm").addEventListener("submit", function(e) {
  e.preventDefault();

  items.unshift({
    name: document.getElementById("itemName").value,
    price: Number(document.getElementById("itemPrice").value),
    category: document.getElementById("itemCategory").value,
    emoji: "📦"
  });

  renderProducts();
  this.reset();
  document.getElementById("message").textContent =
    "Item added to this page! Note: it is not shared with other users.";

  window.scrollTo({top: 0, behavior: "smooth"});
});

renderProducts();
</script>
</body>
</html>
